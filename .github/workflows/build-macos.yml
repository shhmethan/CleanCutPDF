name: Build macOS Test App

on:
  push:
    branches:
      - master1
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13

    steps:
      - name: Get CleanCutPDF code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter PyPDF2 PyMuPDF Pillow tkinterdnd2

      - name: Build CleanCutPDF app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name CleanCutPDF \
            --osx-bundle-identifier com.shhmethan.cleancutpdf \
            --collect-all tkinterdnd2 \
            pdf_splitter.py

      - name: Upload Mac app
        uses: actions/upload-artifact@v4
        with:
          name: CleanCutPDF-macOS
          path: dist/CleanCutPDF.app
